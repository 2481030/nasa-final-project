<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join The Campoore DSKU - Daftar Sekarang</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --dsku-red: #e11d29;
            --nasa-red: #e11d29; /* Menambahkan ini agar class nasa-red berfungsi */
            --dsku-red-glow: rgba(225, 29, 41, 0.5);
            --glass-bg: rgba(10, 15, 30, 0.7);
        }

        body {
            background-color: #02040a;
            color: #c9a919;
            overflow-x: hidden;
            perspective: 2000px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .bg-layer-1 {
            position: fixed;
            top: -10%; left: -10%; width: 120%; height: 120%;
            z-index: -3;
            background-image: url('https://yt3.googleusercontent.com/ytc/AIdro_kG2xzusHXkOvkjtVwSTvZURp94B2Vbfhova8k207CGRsY=s900-c-k-c0x00ffffff-no-rj');
            background-size: cover;
            background-position: center;
            filter: brightness(0.25) contrast(1.2) blur(1px);
        }

        .aurora {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw; height: 80vh;
            background: radial-gradient(circle, var(--dsku-red-glow) 0%, transparent 70%);
            z-index: -2;
            opacity: 0.4;
            filter: blur(100px);
            animation: pulse-aurora 8s ease-in-out infinite alternate;
        }

        @keyframes pulse-aurora {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
            100% { transform: translate(-45%, -55%) scale(1.2); opacity: 0.6; }
        }

        .stars {
            position: fixed;
            inset: 0; z-index: -2;
            background: transparent url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/123163/stars.png') repeat;
            opacity: 0.4;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(30px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.8);
            border-radius: 2.5rem;
        }

        .input-pro {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 1.25rem;
        }

        .input-pro:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--nasa-red);
            box-shadow: 0 0 25px rgba(235, 6, 22, 0.4);
        }

        select option { background-color: #0f172a; color: white; }
        optgroup { background-color: #1a1a1a; color: var(--nasa-red); font-weight: bold; }

        .btn-premium {
            background: linear-gradient(135deg, var(--nasa-red) 0%, #b91c1c 100%);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-premium:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 20px 40px -5px rgba(249, 0, 17, 0.6);
        }
    </style>
</head>
<body class="antialiased flex flex-col min-h-screen">

    <div class="bg-layer-1" id="parallax-bg"></div>
    <div class="stars"></div>
    <div class="aurora"></div>

  <!-- TOMBOL KEMBALI - OPTION 2 -->
<a href="index.html" class="relative group flex items-center gap-4 overflow-hidden">
    <!-- Garis Dekoratif Kiri -->
    <span class="absolute left-0 top-0 h-full w-[2px] bg-red-600 transform scale-y-0 group-hover:scale-y-100 transition-transform duration-300"></span>
    
    <div class="pl-2">
        <div class="flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-red-500 transform group-hover:-translate-x-1 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M11 17l-5-5m0 0l5-5m-5 5h12" />
            </svg>
            <div class="flex flex-col">
                <span class="text-[10px] font-black uppercase tracking-[0.3em] text-white">Back</span>
                <span class="text-[8px] font-medium uppercase tracking-[0.1em] text-gray-500 group-hover:text-red-400 transition-colors">Kembali Ke Halaman Utama</span>
            </div>
        </div>
    </div>
</a>

    <main class="flex-grow container mx-auto px-4 pt-48 pb-24 flex flex-col items-center">
        <div class="w-full max-w-4xl">
            
            <div class="text-center mb-16">
                <h1 class="text-6xl md:text-8xl font-extrabold mb-8 tracking-tighter text-white uppercase leading-none">
                    Join The<br>Mission
                </h1>
                <p class="text-gray-400 max-w-xl mx-auto text-lg">
                    Isi data diri dan amankan tempatmu di Campore Pathfinder DSKU 2026. Mari Berpartisipasi bersama dalam petualangan rohani yang tak terlupakan!
                </p>
            </div>

            <div class="glass-card p-8 md:p-16">
                <form id="registrationForm" class="space-y-10">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-10">
                        
                        <div class="space-y-3">
                            <label class="text-[10px] font-black uppercase tracking-[0.3em] text-gray-500">Full Name</label>
                            <input type="text" id="fullName" required placeholder="Nama Lengkap" class="input-pro w-full px-6 py-5 text-white outline-none">
                        </div>

                        <div class="space-y-3">
                            <label class="text-[10px] font-black uppercase tracking-[0.3em] text-gray-500">Club (Jemaat)</label>
                            <input type="text" id="clubManual" required placeholder="Club Anda" class="input-pro w-full px-6 py-5 text-white outline-none">
                        </div>

                        <div class="space-y-3">
                            <label class="text-[10px] font-black uppercase tracking-[0.3em] text-gray-500">Email Address</label>
                            <input type="email" id="email" required placeholder="email@contoh.com" class="input-pro w-full px-6 py-5 text-white outline-none">
                        </div>

                        <div class="space-y-3">
                            <label class="text-[10px] font-black uppercase tracking-[0.3em] text-gray-500">Phone Number</label>
                            <input type="text" id="phone" required placeholder="+62..." class="input-pro w-full px-6 py-5 text-white outline-none">
                        </div>

                        <div class="space-y-3">
                            <label class="text-[10px] font-black uppercase tracking-[0.3em] text-gray-500">Wilayah Koordinasi</label>
                            <div class="relative">
                                <select id="wilayahSelect" required class="input-pro w-full px-6 py-5 text-white outline-none appearance-none cursor-pointer">
                                    <option value="" disabled selected>Select District</option>
                                    <optgroup label="Bakor PA Wilayah I">
                                        <option value="Distrik Binjai">Distrik Binjai</option>
                                        <option value="Distrik Langkat Hulu">Distrik Langkat Hulu</option>
                                        <option value="Distrik Langkat Hilir">Distrik Langkat Hilir</option>
                                    </optgroup>
                                    <optgroup label="Bakor PA Wilayah II">
                                        <option value="Distrik Karo Timur">Distrik Karo Timur</option>
                                        <option value="Distrik Karo Utara">Distrik Karo Utara</option>
                                        <option value="Distrik Karo Pusat">Distrik Karo Pusat</option>
                                        <option value="Distrik Karo Selatan">Distrik Karo Selatan</option>
                                        <option value="Distrik Karo Barat A">Distrik Karo Barat A</option>
                                        <option value="Distrik Karo Barat B">Distrik Karo Barat B</option>
                                        <option value="Aceh Tenggara">Aceh Tenggara</option>
                                    </optgroup>
                                    <optgroup label="Bakor PA Wilayah III">
                                        <option value="Distrik Siantar Kota">Distrik Siantar Kota</option>
                                        <option value="Distrik Siantar">Distrik Siantar</option>
                                        <option value="SLA-UASN">SLA-UASN</option>
                                        <option value="Distrik Tanjung Kasau">Distrik Tanjung Kasau</option>
                                        <option value="Distrik Perdagangan">Distrik Perdagangan</option>
                                        <option value="Distrik Huta Bayu Raja">Distrik Huta Bayu Raja</option>
                                        <option value="Distrik Tanah Jawa">Distrik Tanah Jawa</option>
                                        <option value="Distrik Simalungun Selatan I">Distrik Simalungun Selatan I</option>
                                        <option value="Distrik Simalungun Selatan II">Distrik Simalungun Selatan II</option>
                                        <option value="Distrik Simalungun Barat">Distrik Simalungun Barat</option>
                                        <option value="Distrik Simalungun Utara">Distrik Simalungun Utara</option>
                                    </optgroup>
                                    <optgroup label="Bakor PA Wilayah IV">
                                        <option value="Distrik Dairi Selatan">Distrik Dairi Selatan</option>
                                        <option value="Distrik Dairi Pusat">Distrik Dairi Pusat</option>
                                        <option value="Distrik Dairi Timur">Distrik Dairi Timur</option>
                                        <option value="Distrik Dairi Barat">Distrik Dairi Barat</option>
                                        <option value="Distrik Parongil">Distrik Parongil</option>
                                        <option value="Distrik Pakpak Barat">Distrik Pakpak Barat</option>
                                    </optgroup>
                                    <optgroup label="Bakor PA Wilayah V">
                                        <option value="Distrik Samosir Timur">Distrik Samosir Timur</option>
                                        <option value="Distrik Samosir Barat">Distrik Samosir Barat</option>
                                        <option value="Distrik Samosir Selatan">Distrik Samosir Selatan</option>
                                    </optgroup>
                                    <optgroup label="Bakor PA Wilayah VI">
                                        <option value="Distrik Toba Timur">Distrik Toba Timur</option>
                                        <option value="Distrik Toba Barat">Distrik Toba Barat</option>
                                        <option value="Distrik Toba Pusat">Distrik Toba Pusat</option>
                                        <option value="Distrik Habinsaran">Distrik Habinsaran</option>
                                    </optgroup>
                                </select>
                            </div>
                        </div>

                        <div class="space-y-3">
                            <label class="text-[10px] font-black uppercase tracking-[0.3em] text-gray-500">Date of Birth</label>
                            <input type="date" id="dob" required class="input-pro w-full px-6 py-5 text-white outline-none [color-scheme:dark]">
                        </div>
                    </div>

                    <!-- GENDER FIXED -->
                    <div class="space-y-4">
                        <label class="text-[10px] font-black uppercase tracking-widest text-gray-500 block">Gender</label>
                        <div class="flex gap-4">
                            
                            <!-- Opsi Man -->
                            <label class="flex-1 relative flex items-center justify-center gap-3 bg-white/5 border border-white/10 p-5 rounded-2xl cursor-pointer hover:bg-white/10 transition-all group">
                                <input type="radio" name="gender" value="Man" required class="peer hidden">
                                
                                <!-- Bulatan luar -->
                                <div class="w-6 h-6 rounded-full border-2 border-gray-600 peer-checked:border-[var(--nasa-red)] flex items-center justify-center transition-all">
                                    <!-- Titik merah tengah -->
                                    <div class="w-3 h-3 bg-[var(--nasa-red)] rounded-full scale-0 peer-checked:scale-100 transition-transform duration-300"></div>
                                </div>
                                
                                <span class="text-xs font-bold uppercase tracking-widest text-gray-400 peer-checked:text-white transition-colors">Man</span>
                                <!-- Glow Border saat terpilih -->
                                <div class="absolute inset-0 border-2 border-transparent peer-checked:border-[var(--nasa-red)]/30 rounded-2xl pointer-events-none"></div>
                            </label>

                            <!-- Opsi Girl -->
                            <label class="flex-1 relative flex items-center justify-center gap-3 bg-white/5 border border-white/10 p-5 rounded-2xl cursor-pointer hover:bg-white/10 transition-all group">
                                <input type="radio" name="gender" value="Girl" required class="peer hidden">
                                
                                <!-- Bulatan luar -->
                                <div class="w-6 h-6 rounded-full border-2 border-gray-600 peer-checked:border-[var(--nasa-red)] flex items-center justify-center transition-all">
                                    <!-- Titik merah tengah -->
                                    <div class="w-3 h-3 bg-[var(--nasa-red)] rounded-full scale-0 peer-checked:scale-100 transition-transform duration-300"></div>
                                </div>
                                
                                <span class="text-xs font-bold uppercase tracking-widest text-gray-400 peer-checked:text-white transition-colors">Girl</span>
                                <!-- Glow Border saat terpilih -->
                                <div class="absolute inset-0 border-2 border-transparent peer-checked:border-[var(--nasa-red)]/30 rounded-2xl pointer-events-none"></div>
                            </label>

                        </div>
                    </div>

                    <div class="space-y-3">
                        <label class="text-[10px] font-black uppercase tracking-[0.3em] text-gray-500">Payment Proof (Receipt)</label>
                        <div class="relative flex flex-col items-center justify-center border-2 border-dashed border-white/10 rounded-[2.5rem] p-12 bg-white/[0.01] hover:bg-white/[0.03] transition-colors">
                            <input type="file" id="bukti_bayar" accept="image/*" required class="absolute inset-0 opacity-0 cursor-pointer z-10">
                            <p class="text-sm text-gray-300 font-bold" id="file-label">Click to upload your receipt</p>
                        </div>
                    </div>

                    <div class="space-y-3">
                        <label class="text-[10px] font-black uppercase tracking-[0.3em] text-gray-500">Motivation In Your Life</label>
                        <textarea id="address" rows="3" required class="input-pro w-full px-6 py-5 text-white outline-none resize-none"></textarea>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full btn-premium py-6 rounded-3xl text-[11px] font-black tracking-[0.5em] uppercase text-white shadow-xl">
                        Daftar Sekarang
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- MODAL BERHASIL -->
    <div id="successModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center bg-black/60 backdrop-blur-sm">
        <div id="modalContent" class="bg-white rounded-2xl p-8 w-[90%] max-w-sm text-center shadow-2xl transform transition-all scale-95 opacity-0">
            <div class="flex justify-center mb-6">
                <div class="w-20 h-20 border-[3px] border-green-100 rounded-full flex items-center justify-center">
                    <svg class="w-10 h-10 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Berhasil!</h2>
            <p class="text-gray-500 mb-8 text-sm">Data berhasil disimpan!</p>
            <button onclick="closeSuccess()" class="w-full bg-[#7c3aed] hover:bg-[#6d28d9] text-white font-semibold py-3 rounded-xl transition-colors shadow-lg">
                Oke
            </button>
        </div>
    </div>

    <script src="Pendaftaran.js"></script>
</body>
</html>
