<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Gallery - Bakor PA DSKU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --nasa-red: #e11d29; }
        body { background-color: #02040a; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        
        /* Glass Effect */
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); }
        
        /* Smooth Tab Animation */
        .tab-btn { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); border-bottom: 2px solid transparent; }
        .tab-btn.active { background: var(--nasa-red); color: white; box-shadow: 0 10px 25px -5px rgba(225, 29, 41, 0.4); transform: translateY(-2px); }

        /* Responsive Grid Image */
        .gallery-item { opacity: 0; transform: translateY(20px); transition: all 0.6s ease-out; }
        .gallery-item.show { opacity: 1; transform: translateY(0); }
        
        .img-container { aspect-ratio: 1 / 1; overflow: hidden; border-radius: 1rem; position: relative; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s scale; }
        .img-container:hover img { transform: scale(1.1); }

        /* Hide Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .fade-in { animation: fadeIn 0.8s ease-in-out; }
    </style>
</head>
<body class="antialiased">

    <!-- Navbar -->
    <nav class="fixed top-0 inset-x-0 z-50 glass border-b border-white/5 px-6 py-4">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-nasa-red rounded-full flex items-center justify-center font-bold text-xs">P</div>
                <span class="text-[10px] font-black tracking-[0.3em] uppercase">Bakor PA <span class="text-red-500">DSKU</span></span>
            </div>
            <a href="Pendaftaran.html" class="text-[9px] font-bold uppercase tracking-widest bg-white/5 px-4 py-2 rounded-full border border-white/10 hover:bg-nasa-red transition-all">Back to Join</a>
        </div>
    </nav>

    <!-- Header -->
    <header class="pt-32 pb-10 px-6 container mx-auto text-center">
        <h1 class="text-5xl md:text-8xl font-extrabold tracking-tighter mb-4 fade-in">MISSION<br><span class="text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-500">GALLERY</span></h1>
        <p class="text-gray-500 text-xs md:text-sm font-bold tracking-[0.4em] uppercase mb-12">Territory Documentation Hub</p>
        
        <!-- Tab Wilayah - Responsif Scroll di Mobile -->
        <div class="flex overflow-x-auto no-scrollbar gap-3 justify-start md:justify-center pb-6">
            <button onclick="changeWilayah(1)" id="tab-1" class="tab-btn active whitespace-nowrap px-6 py-3 rounded-xl border border-white/5 text-[10px] font-black uppercase tracking-widest">Wilayah I</button>
            <button onclick="changeWilayah(2)" id="tab-2" class="tab-btn whitespace-nowrap px-6 py-3 rounded-xl border border-white/5 text-[10px] font-black uppercase tracking-widest">Wilayah II</button>
            <button onclick="changeWilayah(3)" id="tab-3" class="tab-btn whitespace-nowrap px-6 py-3 rounded-xl border border-white/5 text-[10px] font-black uppercase tracking-widest">Wilayah III</button>
            <button onclick="changeWilayah(4)" id="tab-4" class="tab-btn whitespace-nowrap px-6 py-3 rounded-xl border border-white/5 text-[10px] font-black uppercase tracking-widest">Wilayah IV</button>
            <button onclick="changeWilayah(5)" id="tab-5" class="tab-btn whitespace-nowrap px-6 py-3 rounded-xl border border-white/5 text-[10px] font-black uppercase tracking-widest">Wilayah V</button>
            <button onclick="changeWilayah(6)" id="tab-6" class="tab-btn whitespace-nowrap px-6 py-3 rounded-xl border border-white/5 text-[10px] font-black uppercase tracking-widest">Wilayah VI</button>
        </div>
    </header>

    <!-- Info Box -->
    <section class="container mx-auto px-6 mb-12">
        <div class="glass p-8 rounded-[2rem] text-center max-w-4xl mx-auto">
            <h2 id="wilayah-name" class="text-nasa-red font-black text-xl tracking-widest uppercase mb-2 italic">Bakor PA Wilayah I</h2>
            <p id="wilayah-distrik" class="text-gray-400 text-xs md:text-sm leading-relaxed font-medium uppercase tracking-wider italic">Binjai • Langkat Hulu • Langkat Hilir</p>
        </div>
    </section>

    <!-- Photo Grid -->
    <section class="container mx-auto px-6 pb-32">
        <div id="photo-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
            <!-- Photos generated by JavaScript -->
        </div>
    </section>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="fixed inset-0 z-[100] bg-black/95 backdrop-blur-xl hidden flex-col items-center justify-center p-6" onclick="closeLightbox()">
        <img id="lb-img" src="" class="max-w-full max-h-[85vh] rounded-2xl shadow-2xl transition-all duration-500 transform scale-95">
        <div class="mt-6 text-center">
            <p id="lb-cap" class="text-xs font-black tracking-[0.5em] uppercase text-red-600"></p>
            <p class="text-gray-500 text-[9px] uppercase mt-2 tracking-widest">Tap anywhere to return</p>
        </div>
    </div>

    <script src="galeri.js"></script>
</body>
</html>
